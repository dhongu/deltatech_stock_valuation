name: Auto PR for 18.0 Branches

on:
  create:
    branches:
      - '18.0*'   # orice branch care începe cu 18.0

permissions:
  contents: write
  pull-requests: write

jobs:
  auto_pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # avem nevoie de istoricul complet pentru git log

      - name: Set up GitHub CLI
        run: sudo apt-get update && sudo apt-get install -y gh

      - name: Check if PR already exists
        id: check_pr
        env:
          NEW_BRANCH: ${{ github.ref_name }}
          TARGET_BRANCH: "18.0"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_PR=$(gh pr list --head "$NEW_BRANCH" --base "$TARGET_BRANCH" --state open | grep -Eo '#[0-9]+' | head -n1 | tr -d '#')
          if [ -n "$EXISTING_PR" ]; then
            echo "PR already exists: #$EXISTING_PR"
            echo "PR_NUM=$EXISTING_PR" >> $GITHUB_OUTPUT
          else
            echo "PR_NUM=" >> $GITHUB_OUTPUT
          fi

      - name: Fetch target branch
        env:
          TARGET_BRANCH: "18.0"
        run: |
          git fetch origin $TARGET_BRANCH:$TARGET_BRANCH

      - name: Create PR to 18.0
        id: create_pr
        if: steps.check_pr.outputs.PR_NUM == ''
        env:
          NEW_BRANCH: ${{ github.ref_name }}
          TARGET_BRANCH: "18.0"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git fetch origin $TARGET_BRANCH:$TARGET_BRANCH

          # Verifică dacă commiturile există în raport cu baza
          if ! git rev-parse "$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "Eroare: branch-ul $TARGET_BRANCH nu există local!"
            exit 1
          fi

          # Obține primul commit al branch-ului relativ la 18.0
          FIRST_COMMIT=$(git rev-list "origin/$TARGET_BRANCH"..HEAD --reverse | head -n1)

          if [ -z "$FIRST_COMMIT" ]; then
            echo "Nu s-a găsit niciun commit nou față de $TARGET_BRANCH"
            exit 1
          fi

          # Titlul PR = prima linie a commit-ului
          PR_TITLE=$(git log -1 --format=%s "$FIRST_COMMIT")

          # Body PR = mesajul complet al commit-ului
          PR_BODY=$(git log -1 --format=%b "$FIRST_COMMIT")
          PR_BODY="PR creat automat pentru branch-ul $NEW_BRANCH\n\n$PR_BODY"

          # Creează PR și obține numărul
          PR_URL=$(gh pr create \
            --base "$TARGET_BRANCH" \
            --head "$NEW_BRANCH" \
            --title "[$TARGET_BRANCH] $PR_TITLE" \
            --body "$PR_BODY")

          PR_NUM=$(echo "$PR_URL" | grep -oE '[0-9]+$')
          echo "PR_NUM=$PR_NUM" >> $GITHUB_OUTPUT
          echo "Created PR #$PR_NUM"

      - name: Comment on PR
        env:
          CHECK_PR_NUM: ${{ steps.check_pr.outputs.PR_NUM }}
          CREATE_PR_NUM: ${{ steps.create_pr.outputs.PR_NUM }}
          NEW_BRANCH: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Determină ce PR număr să folosești
          if [ -n "$CHECK_PR_NUM" ]; then
            PR_NUM="$CHECK_PR_NUM"
          else
            PR_NUM="$CREATE_PR_NUM"
          fi

          if [ -n "$PR_NUM" ]; then
            gh pr comment "$PR_NUM" --body "PR creat automat pentru branch-ul $NEW_BRANCH. Verifică modificările și testează înainte de merge."
          else
            echo "Nu există PR pentru comentariu."
          fi
