coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto
        threshold: 1%

ignore:
  - "**/tests/**"

# One flag per CI shard: a shard that fails or skips the upload keeps its last
# coverage instead of dropping its addons from the report.
flag_management:
  default_rules:
    carryforward: true
